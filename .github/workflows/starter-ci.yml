name: Starter CI

# Keeps the starter honest: the guidance in this repo is only worth anything if the code that goes with it
# still builds, passes its own guard tests, and stays at 100% coverage.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: starter

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: cp .env.example .env
      - run: docker compose --profile test build test
      - name: Unit tests with coverage (fail_under = 100)
        run: docker compose run --rm test pytest --cov --cov-report=term-missing
      - name: Integration tests
        run: make integration
      - name: Production image builds
        run: docker build --target web -t starter-web .
      - name: Worker log (on failure)
        if: failure()
        run: docker compose logs --no-color worker
