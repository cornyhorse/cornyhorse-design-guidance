name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Local configuration (development defaults only; no real secrets exist here)
        run: cp .env.example .env

      - name: Build the test image
        run: docker compose --profile test build test

      # fail_under = 100 in pyproject.toml: a drop in coverage fails the build.
      - name: Unit tests with coverage
        run: docker compose run --rm test pytest --cov --cov-report=term-missing

      # Real broker, real worker container, real database.
      - name: Integration tests
        run: make integration

      - name: Worker log (on failure)
        if: failure()
        run: docker compose logs --no-color worker
