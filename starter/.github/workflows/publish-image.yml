name: Publish image

# Builds the production web image and pushes it to GitHub Container Registry on every push to main.
# A GHCR package is PRIVATE the first time. Make it public (or log the server in) before a host pulls it:
# https://github.com/users/<owner>/packages/container/<repo>/settings
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          pull: true
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Add one more build-push step per worker image (target: worker, build-args WORKER_REQUIREMENTS=...),
      # each with its own tag, when a worker needs a different set of dependencies.
