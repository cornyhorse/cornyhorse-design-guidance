{% load ui %}
<div class="ch-theme" role="group" aria-label="Colour theme">
    <button type="button" data-theme-set="light" aria-pressed="false" title="Light">{% icon "sun" %}<span class="visually-hidden">Light</span></button>
    <button type="button" data-theme-set="auto" aria-pressed="true" title="Auto (follow system)">{% icon "circle-half" %}<span class="visually-hidden">Auto</span></button>
    <button type="button" data-theme-set="dark" aria-pressed="false" title="Dark">{% icon "moon" %}<span class="visually-hidden">Dark</span></button>
</div>
